<!-- Enquiry Modal Start -->
<div class="modal fade" id="enquiryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content premium-enquiry-modal border-0">
            <div class="modal-header border-0">
                <h4 class="modal-title fw-bold">Request a Call Back</h4>
                <button type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
                id="enquiryCloseBtn">
        </button>
    </div>

            <div class="modal-body p-4">
                <p class="text-muted mb-4">
                    Fill your details and our team will contact you soon.
                </p>

                <form id="enquiryForm" method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Full Name *</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email *</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number *</label>
                        <input type="tel" name="phone" class="form-control" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Profession</label>
                        <select name="profession" class="form-select">
                            <option selected disabled>Select Profession</option>
                            <option>Student</option>
                            <option>Job Seeker</option>
                            <option>Working Professional</option>
                            <option>Business Owner</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">
                        Submit
                    </button>

                </form>
            </div>

        </div>
    </div>
</div>
<!-- Enquiry Modal End -->
