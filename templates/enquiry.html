<!-- ===== Premium Enquiry Modal (Final Stable) ===== -->
<div class="modal fade"
     id="enquiryModal"
     tabindex="-1"
     aria-hidden="true"
     data-bs-backdrop="true"
     data-bs-keyboard="true">

    <div class="modal-dialog modal-dialog-centered modal-lg enquiry-dialog">
        <div class="modal-content premium-enquiry-modal border-0">

            <!-- Header -->
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold text-primary">
                    Request a Call Back
                </h5>

                <!-- IMPORTANT: Bootstrap native close only -->
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                </button>
            </div>

            <!-- Body -->
            <div class="modal-body">
                <p class="text-muted mb-4">
                    Fill your details and our team will contact you soon.
                </p>

                <form id="enquiryForm" method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Full Name *</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email *</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number *</label>
                        <input type="tel" name="phone" class="form-control" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Profession</label>
                        <select name="profession" class="form-select">
                            <option selected disabled>Select Profession</option>
                            <option>Student</option>
                            <option>Job Seeker</option>
                            <option>Working Professional</option>
                            <option>Business Owner</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100 py-3 fw-bold">
                        Submit Enquiry
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>
<!-- ===== End Modal ===== -->
