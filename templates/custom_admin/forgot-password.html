{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Forgot Password | English Bell</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Favicon -->
        <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon.png' %}">
        <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/favicon.png' %}">
        <link rel="apple-touch-icon" href="{% static 'img/favicon.png' %}">
    

        <!-- Bootstrap -->
        <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    
        <!-- Font Awesome (ADD THIS) -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    
        <!-- Main Theme -->
        <link href="{% static 'css/style.css' %}" rel="stylesheet">
    
        <!-- Admin Style -->
        <link href="{% static 'css/admin.css' %}" rel="stylesheet">

                <!-- PWA Admin -->
    <link rel="manifest" href="{% static 'pwa/admin-manifest.json' %}">
    <meta name="theme-color" content="#0d6efd">

    <!-- iPhone Support -->
    <link rel="apple-touch-icon" href="{% static 'pwa/icons/admin-192.png' %}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

</head>

<body class="admin-login-body">

    <div class="login-wrapper">
    
        <div class="login-card row g-0">
    
            <!-- SINGLE PANEL (Same style as login right panel) -->
            <div class="col-12 login-right d-flex align-items-center">
    
                <div class="login-form-wrapper w-100">
    
                    <!-- Header -->
                    <div class="login-header text-center mb-4">
                        <h4 class="mb-1">Reset Password</h4>
                        <p class="text-muted small mb-0">
                            {% if otp_sent %}
                                Enter OTP and new password
                            {% else %}
                                Enter your email to receive OTP
                            {% endif %}
                        </p>
                    </div>
    
                    <form method="post" action="{% url 'admin_forgot_password' %}" id="forgotForm">
    
                        {% csrf_token %}
    
                        {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                        {% endif %}
    
                        {% if success %}
                        <div class="alert alert-success">{{ success }}</div>
                        {% endif %}
    
                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <input type="email"
                                   name="email"
                                   id="forgotEmail"
                                   class="form-control"
                                   value="{{ email|default:'' }}"
                                   {% if otp_sent %}readonly{% endif %}
                                   required>
                        </div>
    
                        <!-- Send OTP -->
                        <button type="submit" class="btn btn-primary w-100 py-2 login-btn mb-3">
                            Send OTP
                        </button>
    
                        <!-- OTP Section -->
                        <div id="otpSection" {% if not otp_sent %}style="display:none;"{% endif %}>
    
                            <div class="mb-3">
                                <label class="form-label">Enter OTP</label>
                                <input type="text"
                                       name="otp"
                                       id="otpInput"
                                       class="form-control"
                                       {% if otp_sent %}required{% endif %}>
                            </div>
    
                            <!-- New Password -->
                            <div class="mb-3 position-relative">
                                <label class="form-label">New Password</label>
                                <input type="password"
                                       name="new_password"
                                       id="newPassword"
                                       class="form-control"
                                       {% if otp_sent %}required{% endif %}>
                                <i class="fa fa-eye toggle-password"
                                   onclick="togglePassword('newPassword', this)"></i>
                            </div>
    
                            <!-- Confirm Password -->
                            <div class="mb-4 position-relative">
                                <label class="form-label">Confirm Password</label>
                                <input type="password"
                                       name="confirm_password"
                                       id="confirmNewPassword"
                                       class="form-control">
                                <i class="fa fa-eye toggle-password"
                                   onclick="togglePassword('confirmNewPassword', this)"></i>
                            </div>
    
                            <button type="submit" class="btn btn-primary w-100 py-2 login-btn mb-3">
                                Reset Password
                            </button>
    
                        </div>
    
                    </form>
    
                    <!-- Back to Login -->
                    <a href="{% url 'admin_login' %}"
                       class="btn btn-outline-primary w-100 py-2 login-btn-outline">
                        Back to Login
                    </a>
    
                </div>
    
            </div>
    
        </div>
    
    </div>
    
    <script src="{% static 'js/admin.js' %}"></script>
    
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register("{% static 'pwa/admin-sw.js' %}")
        .then(function() {
            console.log("Admin PWA Ready");
        });
    }
    </script>
    
    </body>
</html>
